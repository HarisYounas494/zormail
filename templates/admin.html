<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:#070912;color:#e8edf7}a{color:#8ab4ff}.bg{min-height:100vh;background:radial-gradient(circle at top left,#183057 0,transparent 32%),radial-gradient(circle at bottom right,#2c1c55 0,transparent 30%),#070912}.card{background:rgba(15,19,35,.88);border:1px solid #222a44;border-radius:20px;box-shadow:0 25px 70px rgba(0,0,0,.35)}input,select,button,textarea{font:inherit}input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #26304c;background:#0b1020;color:#e8edf7;outline:none}input:focus,select:focus{border-color:#5f95ff}button{border:0;border-radius:12px;padding:12px 16px;background:linear-gradient(135deg,#4f8ef7,#8b5cf6);color:white;font-weight:800;cursor:pointer}button.secondary{background:#141a2e;border:1px solid #2d3658;color:#d7def0}button.danger{background:#7f1d1d}.muted{color:#93a0b8}.err{display:none;margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.35);color:#fecaca}.ok{display:none;margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);color:#bbf7d0}.top{height:62px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid #1d2540;background:#0d1222;gap:14px}.brand{font-size:22px;font-weight:900;letter-spacing:-.03em;background:linear-gradient(135deg,#fff,#8ab4ff);-webkit-background-clip:text;color:transparent}.spacer{flex:1}.wrap{max-width:1100px;margin:0 auto;padding:26px}.grid{display:grid;gap:18px}.two{grid-template-columns:320px 1fr}@media(max-width:800px){.two{grid-template-columns:1fr}.top{flex-wrap:wrap;height:auto;padding:14px}}.list{display:flex;flex-direction:column;gap:10px}.item{padding:14px;border-radius:14px;border:1px solid #202844;background:#0c1120;cursor:pointer}.item:hover{border-color:#4f8ef7}.item.active{border-color:#4f8ef7;background:#101a33}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.mailbody{white-space:pre-wrap;line-height:1.55;background:#080c18;border:1px solid #202844;border-radius:14px;padding:16px;overflow:auto}.htmlbody{background:white;color:#111;padding:18px;border-radius:14px;overflow:auto}.pill{font-size:12px;padding:4px 8px;border-radius:999px;background:#151c31;color:#aab7d4}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid #202844;text-align:left}.code{font-family:ui-monospace,Consolas,monospace;background:#080c18;border:1px solid #202844;border-radius:12px;padding:12px;overflow:auto}
</style></head><body><div class="top"><div class="brand">ZorMail Admin</div><span class="pill">secret: /{{admin_path}}</span><div class="spacer"></div><a href="/logout"><button class="secondary">Logout</button></a></div><div class="wrap grid" style="grid-template-columns:1fr;max-width:1200px">
<section class="card" style="padding:20px"><h2>Setup</h2><p class="muted">Webhook URL</p><div class="code" id="whurl"></div><p class="muted">Webhook Secret</p><div class="code" id="secret"></div><p class="muted">Cloudflare Worker should POST JSON to this URL and send the secret in <b>X-ZorMail-Secret</b>.</p></section>
<section class="card" style="padding:20px"><h2>Domains</h2><div class="row"><input id="domain" placeholder="example.com"><button onclick="addDomain()">Add domain</button></div><div id="domains" class="list" style="margin-top:14px"></div><div class="err" id="err"></div><div class="ok" id="ok"></div></section>
<section class="card" style="padding:20px"><h2>Users / Mailboxes</h2><table class="table"><thead><tr><th>Email</th><th>Total</th><th>Unread</th><th>Status</th><th>Actions</th></tr></thead><tbody id="users"></tbody></table></section>
<section class="card" style="padding:20px"><h2>Admin Password</h2><div class="row"><input id="oldp" type="password" placeholder="Current"><input id="newp" type="password" placeholder="New 12+ chars"><button onclick="changeAdminPass()">Change</button></div></section>
</div><script>
function msg(t,good=false){const el=good?ok:err;el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',4000)}
async function api(url,opt={}){const r=await fetch(url,opt);const j=await r.json().catch(()=>({error:'Request failed'}));if(!r.ok)throw Error(j.error||'Request failed');return j}
async function load(){const c=await api('/api/admin/config');whurl.textContent=c.webhook_url_hint;secret.textContent=c.webhook_secret;domains.innerHTML=(c.domains||[]).map(d=>`<div class="item row"><b style="flex:1">${d.domain}</b><button class="danger" onclick="delDomain('${d.domain}')">Delete</button></div>`).join('')||'<p class="muted">No domains yet.</p>';const u=await api('/api/admin/users');users.innerHTML=(u.users||[]).map(x=>`<tr><td>${x.email}</td><td>${x.total}</td><td>${x.unread}</td><td>${x.disabled?'Disabled':'Active'}</td><td><button class="secondary" onclick="testMail('${x.email}')">Test mail</button> <button class="danger" onclick="toggleUser('${x.email}')">${x.disabled?'Enable':'Disable'}</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">No users yet.</td></tr>'}
async function addDomain(){try{await api('/api/admin/domain',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({domain:domain.value})});domain.value='';msg('Domain added',true);load()}catch(e){msg(e.message)}}
async function delDomain(d){try{await api('/api/admin/domain/'+encodeURIComponent(d),{method:'DELETE'});load()}catch(e){msg(e.message)}}
async function toggleUser(e){try{await api('/api/admin/users/'+encodeURIComponent(e)+'/toggle',{method:'POST'});load()}catch(x){msg(x.message)}}
async function testMail(e){try{await api('/api/admin/test-mail',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address:e})});msg('Test mail sent',true)}catch(x){msg(x.message)}}
async function changeAdminPass(){try{await api('/api/admin/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({old:oldp.value,new:newp.value})});oldp.value=newp.value='';msg('Password changed',true)}catch(e){msg(e.message)}}
load()
</script></body></html>
