<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:#070912;color:#e8edf7}a{color:#8ab4ff}.bg{min-height:100vh;background:radial-gradient(circle at top left,#183057 0,transparent 32%),radial-gradient(circle at bottom right,#2c1c55 0,transparent 30%),#070912}.card{background:rgba(15,19,35,.88);border:1px solid #222a44;border-radius:20px;box-shadow:0 25px 70px rgba(0,0,0,.35)}input,select,button,textarea{font:inherit}input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #26304c;background:#0b1020;color:#e8edf7;outline:none}input:focus,select:focus{border-color:#5f95ff}button{border:0;border-radius:12px;padding:12px 16px;background:linear-gradient(135deg,#4f8ef7,#8b5cf6);color:white;font-weight:800;cursor:pointer}button.secondary{background:#141a2e;border:1px solid #2d3658;color:#d7def0}button.danger{background:#7f1d1d}.muted{color:#93a0b8}.err{display:none;margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.35);color:#fecaca}.ok{display:none;margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);color:#bbf7d0}.top{height:62px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid #1d2540;background:#0d1222;gap:14px}.brand{font-size:22px;font-weight:900;letter-spacing:-.03em;background:linear-gradient(135deg,#fff,#8ab4ff);-webkit-background-clip:text;color:transparent}.spacer{flex:1}.wrap{max-width:1100px;margin:0 auto;padding:26px}.grid{display:grid;gap:18px}.two{grid-template-columns:320px 1fr}@media(max-width:800px){.two{grid-template-columns:1fr}.top{flex-wrap:wrap;height:auto;padding:14px}}.list{display:flex;flex-direction:column;gap:10px}.item{padding:14px;border-radius:14px;border:1px solid #202844;background:#0c1120;cursor:pointer}.item:hover{border-color:#4f8ef7}.item.active{border-color:#4f8ef7;background:#101a33}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.mailbody{white-space:pre-wrap;line-height:1.55;background:#080c18;border:1px solid #202844;border-radius:14px;padding:16px;overflow:auto}.htmlbody{background:white;color:#111;padding:18px;border-radius:14px;overflow:auto}.pill{font-size:12px;padding:4px 8px;border-radius:999px;background:#151c31;color:#aab7d4}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid #202844;text-align:left}.code{font-family:ui-monospace,Consolas,monospace;background:#080c18;border:1px solid #202844;border-radius:12px;padding:12px;overflow:auto}
</style></head><body class="bg"><main style="min-height:100vh;display:grid;place-items:center;padding:24px"><div class="card" style="width:100%;max-width:420px;padding:28px"><h1>Admin Access</h1><p class="muted">Secret admin route: <b>/{{admin_path}}</b></p><label>Password</label><input id="password" type="password" autofocus><button style="width:100%;margin-top:16px" onclick="login()">Enter</button><div class="err" id="err"></div></div></main><script>
async function login(){try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Failed');location='/admin-panel'}catch(e){err.textContent=e.message;err.style.display='block'}}
document.addEventListener('keydown',e=>{if(e.key==='Enter')login()})
</script></body></html>
